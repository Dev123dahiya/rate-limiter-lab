[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rate-limiter-lab"
version = "0.1.0"
description = "Four rate-limiting algorithms behind one interface, with ASGI middleware and benchmarks"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
demo = ["fastapi>=0.110", "uvicorn>=0.29"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["ratelimit"]
